[project]
name = "sces-backend"
version = "0.1.0"
description = "School Cluster Evaluation System API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pymysql>=1.1",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "fpdf2>=2.8",
    "uharfbuzz>=0.40",
    "pikepdf>=9.0",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["security/common_passwords.txt", "pdf/fonts/*.ttf", "pdf/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx`"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "F811"]  # F811: shared fixtures imported from other test modules
"migrations/*" = ["E501", "I"]
